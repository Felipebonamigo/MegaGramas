# megagramas.com.br — site estático em VPS.
#
# Instalar em /etc/nginx/sites-available/megagramas e ativar com:
#   ln -s /etc/nginx/sites-available/megagramas /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# O bloco de TLS é escrito pelo certbot; rode-o depois de subir este arquivo.

# www redireciona para o domínio raiz, para o Google não indexar os dois
# como sites distintos.
server {
    listen 80;
    listen [::]:80;
    server_name www.megagramas.com.br;
    return 301 https://megagramas.com.br$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name megagramas.com.br;

    root /var/www/megagramas;
    index index.html;

    # Diretório sem barra final: /calculadora -> /calculadora/
    # (o index acima resolve /calculadora/ para /calculadora/index.html)
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # ---- Compressão ----
    # woff2 e png já vêm comprimidos, então ficam de fora.
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css text/xml application/javascript
               application/json application/xml image/svg+xml;

    # ---- Cache ----
    # As fontes podem ir a um ano: o conteúdo delas nunca muda.
    location ~* \.woff2$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }
    # CSS e JS ficam em uma hora de propósito: os arquivos não têm hash de
    # versão no nome, então um cache longo faria uma atualização demorar dias
    # para chegar a quem já visitou. Quando o conteúdo estabilizar, vale subir.
    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=3600";
    }
    location ~* \.(png|jpe?g|webp|svg|ico)$ {
        add_header Cache-Control "public, max-age=2592000";
    }
    # O HTML nunca é cacheado, senão uma correção de texto não aparece.
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    # ---- Segurança ----
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Nada de arquivo oculto (.git, .env) sendo servido.
    location ~ /\. {
        deny all;
    }
}
